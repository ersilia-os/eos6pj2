Status: In progress
Title: NaFM Natural Product Embeddings
Description: NaFM is a scaffold-aware graph foundation model that turns a 
  natural-product SMILES into a 512-dimensional embedding. Pretrained on the 
  COCONUT natural-product database via contrastive and masked-graph learning, it
  captures scaffold and side-chain information useful for taxonomy 
  classification, genome mining, and virtual screening. The embedding is a 
  general-purpose featurizer specialised for natural-product chemical space.
