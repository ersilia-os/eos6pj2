Status: Ready
Title: NaFM Natural Product Embeddings
Description: Encodes a molecule as 1,024 features with NaFM, a scaffold-aware graph
  foundation model that Ding and colleagues pretrained on the COCONUT natural product
  collection by combining contrastive learning with masked subgraph reconstruction.
  Separating scaffold-level biosynthetic signal from side-chain decoration lets the
  embedding serve taxonomy classification, the linking of metabolites to biosynthetic
  gene clusters, and virtual screening. Natural product chemistry is the intended
  domain, and individual dimensions carry no direct chemical reading.
