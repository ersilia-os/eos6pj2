Status: Ready
Title: NaFM Natural Product Embeddings
Description: NaFM produces 1,024 features from a foundation model pretrained specifically
  on natural products, whose fused rings, dense stereocentres and unusual scaffolds
  are poorly represented in the synthetic compound sets most encoders learn from.
  Pretraining on natural product structures gives an embedding better matched to that
  chemistry, useful for tasks from taxonomic assignment to bioactivity prediction.
  As with other learned representations, individual dimensions have no direct chemical
  reading.
